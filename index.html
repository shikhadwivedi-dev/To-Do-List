<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List | Shikha Dwivedi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#f3e8ff; min-height:100vh; display:flex; justify-content:center; padding:40px 15px; }
.box { background:white; width:100%; max-width:480px; padding:28px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); height:fit-content; }
h1 { text-align:center; color:#6d28d9; font-size:26px; margin-bottom:5px; }
p { text-align:center; color:#666; font-size:14px; margin-bottom:20px; }
.input-row { display:flex; gap:10px; margin-bottom:20px; }
input { flex:1; padding:12px; border:2px solid #e9d5ff; border-radius:10px; outline:none; font-size:15px; }
input:focus { border-color:#a855f7; }
button.add { background:#9333ea; color:white; border:none; padding:12px 18px; border-radius:10px; cursor:pointer; font-weight:600; }
ul { list-style:none; }
li { display:flex; align-items:center; gap:10px; background:#faf5ff; padding:12px; border-radius:10px; margin-bottom:10px; }
li span { flex:1; }
li.done span { text-decoration:line-through; color:#999; }
.del { background:#fee2e2; border:none; color:#dc2626; padding:6px 10px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
<h1>✨ My To-Do List</h1>
<p>Stay organized, one task at a time!</p>
<div class="input-row">
<input id="taskInput" placeholder="Add a new task...">
<button class="add" onclick="addTask()">Add</button>
</div>
<ul id="taskList"></ul>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
function save(){ localStorage.setItem('tasks', JSON.stringify(tasks)); }
function render(){
  let list = document.getElementById('taskList');
  list.innerHTML = '';
  tasks.forEach((t, i) => {
    let li = document.createElement('li');
    if(t.done) li.className = 'done';
    li.innerHTML = `<input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span>${t.text}</span><button class="del" onclick="deleteTask(${i})">Delete</button>`;
    list.appendChild(li);
  });
}
function addTask(){
  let input = document.getElementById('taskInput');
  if(input.value.trim() === '') return;
  tasks.push({text: input.value, done:false});
  input.value = ''; save(); render();
}
function toggleTask(i){ tasks[i].done = !tasks[i].done; save(); render(); }
function deleteTask(i){ tasks.splice(i,1); save(); render(); }
document.getElementById('taskInput').addEventListener('keypress', e => { if(e.key==='Enter') addTask(); });
render();
</script>
</body>
</html>
